apiVersion: apps/v1
kind: Deployment
metadata:
  name: bestrong-web-api
  labels:
    app: bestrong-web-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bestrong-web-api
  template:
    metadata:
      labels:
        app: bestrong-web-api
    spec:
      containers:
      - name: bestrong-web-api
        image: bestrong-web-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "0.5"
            memory: "512Mi"
          requests:
            cpu: "0.2"
            memory: "256Mi"
